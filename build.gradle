plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def modVersionValue = providers.gradleProperty('mod_version').get()
def minecraftVersionValue = providers.gradleProperty('minecraft_version').get()
def loaderVersionValue = providers.gradleProperty('loader_version').get()
def minimumLoaderVersionValue = providers.gradleProperty('minimum_loader_version').get()
def fabricApiVersionValue = providers.gradleProperty('fabric_api_version').get()
def archivesBaseNameValue = providers.gradleProperty('archives_base_name').get()
def mavenGroupValue = providers.gradleProperty('maven_group').get()
def junitVersionValue = providers.gradleProperty('junit_version').get()

version = modVersionValue
group = mavenGroupValue

base {
    archivesName = archivesBaseNameValue
}

def gameTestSourceSet = sourceSets.create('gametest')
gameTestSourceSet.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
gameTestSourceSet.runtimeClasspath += sourceSets.main.runtimeClasspath

loom {
    splitEnvironmentSourceSets()

    mods {
        stepup_camera_smoother {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        stepup_camera_smoother_gametest {
            sourceSet gameTestSourceSet
        }
    }
}

gameTestSourceSet.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath

fabricApi {
    configureTests {
        createSourceSet = false
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

loom.runs.named('clientGameTest') {
    source gameTestSourceSet
}

tasks.named('runClientGameTest') {
    classpath += sourceSets.client.runtimeClasspath
}

repositories {
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersionValue}"
    implementation "net.fabricmc:fabric-loader:${loaderVersionValue}"
    gametestImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersionValue}"

    testImplementation platform("org.junit:junit-bom:${junitVersionValue}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This profile is only for local and CI compatibility smoke tests. None of
    // these jars are bundled in this mod's distributable jar.
    if (providers.gradleProperty('include_stepitup_runtime').map { it.toBoolean() }.getOrElse(false)) {
        modLocalRuntime "net.fabricmc.fabric-api:fabric-api:${fabricApiVersionValue}"
        modLocalRuntime "maven.modrinth:9ggA4qiy:${providers.gradleProperty('stepitup_version_id').get()}"
        modLocalRuntime "maven.modrinth:9s6osm5g:${providers.gradleProperty('cloth_config_version_id').get()}"
    }
}

processResources {
    inputs.property 'version', modVersionValue
    inputs.property 'minecraft_version', minecraftVersionValue
    inputs.property 'loader_version', loaderVersionValue
    inputs.property 'minimum_loader_version', minimumLoaderVersionValue

    filesMatching('fabric.mod.json') {
        expand(
            version: modVersionValue,
            minecraft_version: minecraftVersionValue,
            loader_version: loaderVersionValue,
            minimum_loader_version: minimumLoaderVersionValue
        )
    }
}

tasks.named('processGametestResources') {
    inputs.property 'version', modVersionValue
    filesMatching('fabric.mod.json') {
        expand(version: modVersionValue)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-processing'])
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '9.5.1'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = 'bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('LICENSE') {
        rename { licenseName -> "${licenseName}_${archivesBaseNameValue}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = archivesBaseNameValue
            from components.java
        }
    }
}
