plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def modVersionValue = providers.gradleProperty('mod_version').get()
def minecraftVersionValue = providers.gradleProperty('minecraft_version').get()
def loaderVersionValue = providers.gradleProperty('loader_version').get()
def minimumLoaderVersionValue = providers.gradleProperty('minimum_loader_version').get()
def fabricApiVersionValue = providers.gradleProperty('fabric_api_version').get()
def modMenuVersionValue = providers.gradleProperty('modmenu_version').get()
def modMenuVersionIdValue = providers.gradleProperty('modmenu_version_id').get()
def textPlaceholderVersionIdValue = providers.gradleProperty('text_placeholder_version_id').get()
def archivesBaseNameValue = providers.gradleProperty('archives_base_name').get()
def mavenGroupValue = providers.gradleProperty('maven_group').get()
def junitVersionValue = providers.gradleProperty('junit_version').get()
def includeStepItUpRuntime = providers.gradleProperty('include_stepitup_runtime')
    .map { it.toBoolean() }
    .getOrElse(false)
def includeModMenuRuntime = providers.gradleProperty('include_modmenu_runtime')
    .map { it.toBoolean() }
    .getOrElse(false)

version = modVersionValue
group = mavenGroupValue

base {
    archivesName = archivesBaseNameValue
}

def gameTestSourceSet = sourceSets.create('gametest')
gameTestSourceSet.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
gameTestSourceSet.runtimeClasspath += sourceSets.main.runtimeClasspath

loom {
    splitEnvironmentSourceSets()

    mods {
        stepup_camera_smoother {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        stepup_camera_smoother_gametest {
            sourceSet gameTestSourceSet
        }
    }
}

gameTestSourceSet.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath

fabricApi {
    configureTests {
        createSourceSet = false
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

loom.runs.named('clientGameTest') {
    source gameTestSourceSet
}

tasks.named('runClientGameTest') {
    classpath += sourceSets.client.runtimeClasspath
}

repositories {
    mavenCentral()

    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
        content {
            includeGroup 'com.terraformersmc'
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersionValue}"
    implementation "net.fabricmc:fabric-loader:${loaderVersionValue}"
    compileOnly "com.terraformersmc:modmenu:${modMenuVersionValue}"
    gametestImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersionValue}"

    testImplementation platform("org.junit:junit-bom:${junitVersionValue}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // These profiles are only for local and CI compatibility smoke tests. None
    // of these jars are bundled in this mod's distributable jar.
    if (includeStepItUpRuntime || includeModMenuRuntime) {
        clientCompileOnly "net.fabricmc.fabric-api:fabric-api:${fabricApiVersionValue}"
        localRuntime "net.fabricmc.fabric-api:fabric-api:${fabricApiVersionValue}"
    }

    if (includeStepItUpRuntime) {
        if (providers.gradleProperty('stepitup_version_id').get().isBlank()) {
            throw new GradleException('StepItUp has no verified Minecraft 26.3 fixture yet; test standalone or with Mod Menu.')
        }
        localRuntime "maven.modrinth:9ggA4qiy:${providers.gradleProperty('stepitup_version_id').get()}"
        localRuntime "maven.modrinth:9s6osm5g:${providers.gradleProperty('cloth_config_version_id').get()}"
    }

    if (includeModMenuRuntime) {
        localRuntime "maven.modrinth:mOgUt4GM:${modMenuVersionIdValue}"
        localRuntime "maven.modrinth:eXts2L7r:${textPlaceholderVersionIdValue}"
    }
}

processResources {
    inputs.property 'version', modVersionValue
    inputs.property 'minecraft_version', minecraftVersionValue
    inputs.property 'loader_version', loaderVersionValue
    inputs.property 'minimum_loader_version', minimumLoaderVersionValue
    inputs.property 'modmenu_version', modMenuVersionValue

    filesMatching('fabric.mod.json') {
        expand(
            version: modVersionValue,
            minecraft_version: minecraftVersionValue,
            loader_version: loaderVersionValue,
            minimum_loader_version: minimumLoaderVersionValue,
            modmenu_version: modMenuVersionValue
        )
    }
}

tasks.named('processGametestResources') {
    inputs.property 'version', modVersionValue
    filesMatching('fabric.mod.json') {
        expand(version: modVersionValue)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-processing'])
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '9.6.0'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = 'bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('LICENSE') {
        rename { licenseName -> "${licenseName}_${archivesBaseNameValue}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = archivesBaseNameValue
            from components.java
        }
    }
}
