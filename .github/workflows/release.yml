name: Publish tested release

on:
  workflow_dispatch:
    inputs:
      manual_tested_commit:
        description: Exact 40-character commit SHA tested in Minecraft
        required: true
        type: string
      manual_tested_sha256:
        description: SHA-256 of the exact jar tested in Minecraft
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out selected tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enforce release gates
        shell: bash
        env:
          TESTED_COMMIT: ${{ inputs.manual_tested_commit }}
          TESTED_SHA256: ${{ inputs.manual_tested_sha256 }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Select an existing version tag when dispatching this workflow." >&2
            exit 1
          fi
          if [[ ! "${TESTED_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "manual_tested_commit must be an exact lowercase 40-character SHA." >&2
            exit 1
          fi
          if [[ ! "${TESTED_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "manual_tested_sha256 must be an exact lowercase SHA-256." >&2
            exit 1
          fi
          if [[ "${TESTED_COMMIT}" != "${GITHUB_SHA}" ]]; then
            echo "The manually tested commit does not equal the selected tag commit." >&2
            exit 1
          fi
          release_ready="$(sed -n 's/^release_ready=//p' gradle.properties)"
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "${release_ready}" != "true" ]]; then
            echo "release_ready must be true in the tagged commit." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod version v${version}." >&2
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          validate-wrappers: true

      - name: Rebuild and test the tagged source
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test build
          python3 scripts/audit_jar.py

      - name: Run bare client boot test
        run: xvfb-run -a ./gradlew --no-daemon runClientGameTest

      - name: Run StepItUp-only client boot test
        env:
          STEPUP_CAMERA_SMOOTHER_EXPECT_STEPITUP: 'true'
        run: |
          xvfb-run -a ./gradlew --no-daemon \
            -Pinclude_stepitup_runtime=true \
            runClientGameTest

      - name: Run Mod Menu-only client boot test
        env:
          STEPUP_CAMERA_SMOOTHER_EXPECT_MODMENU: 'true'
        run: |
          xvfb-run -a ./gradlew --no-daemon \
            -Pinclude_modmenu_runtime=true \
            runClientGameTest

      - name: Run StepItUp and Mod Menu client boot test
        env:
          STEPUP_CAMERA_SMOOTHER_EXPECT_STEPITUP: 'true'
          STEPUP_CAMERA_SMOOTHER_EXPECT_MODMENU: 'true'
        run: |
          xvfb-run -a ./gradlew --no-daemon \
            -Pinclude_stepitup_runtime=true \
            -Pinclude_modmenu_runtime=true \
            runClientGameTest

      - name: Match the manually tested jar
        shell: bash
        env:
          TESTED_SHA256: ${{ inputs.manual_tested_sha256 }}
        run: |
          set -euo pipefail
          jar_path="$(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          rebuilt_sha256="$(sha256sum "${jar_path}" | cut -d' ' -f1)"
          if [[ "${rebuilt_sha256}" != "${TESTED_SHA256}" ]]; then
            echo "Rebuilt jar SHA-256 does not match the manually tested jar." >&2
            exit 1
          fi

      - name: Create release evidence
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=build/source-snapshot.zip "${GITHUB_SHA}"
          jar_path="$(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          jar_name="$(basename "${jar_path}")"
          jar_sha256="$(sha256sum "${jar_path}" | cut -d' ' -f1)"
          {
            echo "commit=${GITHUB_SHA}"
            echo "tag=${GITHUB_REF_NAME}"
            echo "jar=${jar_name}"
            echo "sha256=${jar_sha256}"
            java --version 2>&1 | sed 's/^/java=/'
            ./gradlew --version | sed 's/^/gradle=/'
          } > build/PROVENANCE.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          release_flags=()
          if [[ "${version}" == *alpha* || "${version}" == *beta* || "${version}" == *rc* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            build/libs/stepup-camera-smoother-${version}.jar \
            build/checksums/stepup-camera-smoother-${version}.jar.sha256 \
            build/source-snapshot.zip \
            build/PROVENANCE.txt \
            --verify-tag \
            --title "StepUp Camera Smoother ${version}" \
            --notes-file RELEASE_NOTES.md \
            "${release_flags[@]}"
