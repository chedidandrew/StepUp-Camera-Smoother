name: Verify all Minecraft ports
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1', '26.1.1', '26.1.2', '26.2', '26.3', '1.21.11', '1.21.1']
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          validate-wrappers: true
      - name: Build and run shared unit tests
        run: python scripts/build_ports.py --workers 1 --only '${{ matrix.minecraft }}/${{ matrix.loader }}'
      - name: Verify real client and mouse input
        run: xvfb-run -a python scripts/build_ports.py --smoke --workers 1 --only '${{ matrix.minecraft }}/${{ matrix.loader }}'
      - name: Audit playable artifact
        run: python scripts/package_ports.py --require-smoke --only '${{ matrix.minecraft }}/${{ matrix.loader }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: StepUp-0.3.1-${{ matrix.loader }}-mc${{ matrix.minecraft }}
          path: build/releases/0.3.1/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: port-failure-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: |
            build/ports/
            ports/${{ matrix.minecraft }}/${{ matrix.loader }}/build/reports/
            ports/${{ matrix.minecraft }}/${{ matrix.loader }}/build/smoke/run/logs/
            ports/${{ matrix.minecraft }}/${{ matrix.loader }}/build/smoke/run/crash-reports/
