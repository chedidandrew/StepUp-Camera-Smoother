name: Build and verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          validate-wrappers: true

      - name: Build and run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test build

      - name: Audit playable jar
        run: python3 scripts/audit_jar.py

      - name: Run standalone client boot test
        run: xvfb-run -a ./gradlew --no-daemon runClientGameTest

      - name: Run StepItUp compatibility client boot test
        env:
          STEPUP_CAMERA_SMOOTHER_EXPECT_STEPITUP: 'true'
        run: |
          xvfb-run -a ./gradlew --no-daemon \
            -Pinclude_stepitup_runtime=true \
            runClientGameTest

      - name: Create source snapshot
        run: git archive --format=zip --output=build/source-snapshot.zip HEAD

      - name: Upload client logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-boot-logs-${{ github.sha }}
          path: |
            run/logs/
            run/crash-reports/
            build/run/clientGameTest/logs/
            build/run/clientGameTest/crash-reports/
            build/run/clientGameTest/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failure-reports-${{ github.sha }}
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: StepUp-Camera-Smoother-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            build/checksums/*.sha256
            build/source-snapshot.zip
          if-no-files-found: error
          retention-days: 14
